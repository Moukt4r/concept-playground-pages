<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FPL Analyzer</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: dark;
        --bg: #090c10;
        --panel: #10151c;
        --panel-2: #0d1218;
        --line: #1e2731;
        --text: #f0f6fc;
        --muted: #8b98a5;
        --blue: #58a6ff;
        --purple: #a371f7;
        --green: #3fb950;
        --amber: #d29922;
        --red: #f85149;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 12% -5%, rgb(47 129 247 / 16%), transparent 32rem),
          radial-gradient(circle at 88% 0%, rgb(163 113 247 / 12%), transparent 28rem),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      a { color: var(--blue); }
      code { background: rgb(255 255 255 / 6%); padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.9em; }
      .dim { color: var(--muted); }

      /* ---- app shell ---- */
      .topbar {
        position: sticky; top: 0; z-index: 40;
        backdrop-filter: blur(12px);
        background: rgb(9 12 16 / 82%);
        border-bottom: 1px solid var(--line);
      }
      .topbar-inner {
        width: min(80rem, calc(100% - 2.5rem)); margin-inline: auto;
        display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
        padding: 0.75rem 0;
      }
      .brand { display: flex; align-items: baseline; gap: 0.55rem; margin-right: 0.5rem; }
      .brand b { font-size: 1.02rem; letter-spacing: -0.01em; }
      .brand span { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; }
      nav.tabs { display: flex; gap: 0.25rem; flex-wrap: wrap; }
      .navtab {
        appearance: none; cursor: pointer;
        padding: 0.4rem 0.8rem; border-radius: 0.5rem;
        border: 1px solid transparent; background: transparent;
        color: var(--muted); font: inherit; font-size: 0.82rem; font-weight: 600;
        display: flex; align-items: center; gap: 0.4rem;
      }
      .navtab:hover { background: rgb(255 255 255 / 4%); color: var(--text); }
      .navtab[aria-current="page"] { background: rgb(88 166 255 / 15%); color: var(--text); border-color: rgb(88 166 255 / 35%); }
      .navtab .count { font-size: 0.66rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .stale { margin-left: auto; font-size: 0.68rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .stale b { color: var(--amber); }

      .shell { width: min(80rem, calc(100% - 2.5rem)); margin-inline: auto; padding-bottom: 4rem; }
      .view { display: none; }
      .view.active { display: block; animation: fade 0.15s ease; }
      @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

      .vh { padding: 1.75rem 0 1.1rem; }
      .vh h1 { margin: 0 0 0.35rem; font-size: clamp(1.5rem, 3vw, 2.1rem); letter-spacing: -0.02em; }
      .vh p { margin: 0; color: var(--muted); font-size: 0.9rem; max-width: 52rem; line-height: 1.6; }

      .panel { border: 1px solid var(--line); border-radius: 0.8rem; background: var(--panel); overflow: hidden; margin-bottom: 1.5rem; }
      .panel-head { padding: 1.05rem 1.2rem 0.85rem; border-bottom: 1px solid var(--line); }
      .panel-head h2 { margin: 0 0 0.25rem; font-size: 1.02rem; }
      .panel-head p { margin: 0; color: var(--muted); font-size: 0.78rem; line-height: 1.5; }

      .grid2 { display: grid; gap: 1.5rem; grid-template-columns: 1fr; }
      @media (min-width: 64rem) { .grid2 { grid-template-columns: 1fr 1fr; } }

      /* chips + meta */
      .meta { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .chip { padding: 0.35rem 0.7rem; border: 1px solid var(--line); border-radius: 999px; background: rgb(255 255 255 / 3%); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .chip b { color: var(--text); font-weight: 600; }

      .warn { padding: 1rem 1.2rem; border: 1px solid rgb(210 153 34 / 35%); border-left: 3px solid var(--amber); border-radius: 0.6rem; background: rgb(210 153 34 / 8%); margin-bottom: 1.5rem; }
      .warn h2 { margin: 0 0 0.55rem; font-size: 0.82rem; color: var(--amber); letter-spacing: 0.04em; text-transform: uppercase; }
      .warn ul { margin: 0; padding-left: 1.1rem; color: #d6c9a8; font-size: 0.84rem; line-height: 1.6; }
      .warn li + li { margin-top: 0.3rem; }

      /* tables */
      table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
      th { padding: 0.55rem 0.5rem; color: var(--muted); font-size: 0.66rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--panel); cursor: pointer; user-select: none; }
      th.left, td.left { text-align: left; }
      th[data-sort]:hover { color: var(--text); }
      th .arrow { color: var(--blue); }
      td { padding: 0.48rem 0.5rem; border-bottom: 1px solid rgb(30 39 49 / 55%); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: rgb(88 166 255 / 8%); }
      tbody tr:last-child td { border-bottom: 0; }
      .rank { color: var(--muted); width: 2rem; }
      .who { display: flex; align-items: baseline; gap: 0.45rem; }
      .name { font-weight: 600; }
      .club { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.04em; }
      .big { font-weight: 700; }
      .accent { color: var(--blue); } .accent-2 { color: var(--purple); }
      .pos { display: inline-block; min-width: 2.4rem; padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.65rem; font-weight: 700; text-align: center; }
      .pos.GKP { background: rgb(210 153 34 / 18%); color: #e3b341; }
      .pos.DEF { background: rgb(63 185 80 / 16%); color: #56d364; }
      .pos.MID { background: rgb(88 166 255 / 16%); color: var(--blue); }
      .pos.FWD { background: rgb(248 81 73 / 16%); color: #ff7b72; }

      .risk { color: var(--amber); font-size: 0.68rem; font-weight: 700; }
      .newclub { color: var(--purple); font-size: 0.68rem; font-weight: 700; border: 1px solid rgb(163 113 247 / 40%); border-radius: 0.25rem; padding: 0 0.25rem; }
      .sp { font-size: 0.62rem; font-weight: 800; padding: 0.05rem 0.25rem; border-radius: 0.25rem; white-space: nowrap; }
      .sp-pen1 { background: rgb(63 185 80 / 20%); color: #56d364; }
      .sp-pen2 { background: rgb(63 185 80 / 10%); color: #3fb950; }
      .sp-fk { background: rgb(88 166 255 / 14%); color: var(--blue); }
      .sp-ck { background: rgb(255 255 255 / 7%); color: var(--muted); }

      /* filter bar */
      .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.9rem 1.2rem; border-bottom: 1px solid var(--line); align-items: center; }
      .filters input, .filters select {
        appearance: none; font: inherit; font-size: 0.82rem; color: var(--text);
        background: var(--panel-2); border: 1px solid var(--line); border-radius: 0.45rem; padding: 0.4rem 0.6rem;
      }
      .filters input { min-width: 12rem; }
      .filters input:focus, .filters select:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
      .pill-row { display: flex; gap: 0.3rem; }
      .pill { appearance: none; cursor: pointer; font: inherit; font-size: 0.75rem; font-weight: 600; padding: 0.35rem 0.6rem; border-radius: 0.4rem; border: 1px solid var(--line); background: transparent; color: var(--muted); }
      .pill[aria-pressed="true"] { background: rgb(88 166 255 / 16%); color: var(--text); border-color: var(--blue); }
      .rescount { margin-left: auto; color: var(--muted); font-size: 0.75rem; }
      .table-scroll { max-height: 34rem; overflow: auto; }

      /* squads (pitch) */
      .sq-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 1.1rem 1.2rem 0; }
      .sq-tab { appearance: none; cursor: pointer; text-align: left; padding: 0.5rem 0.85rem; border: 1px solid var(--line); border-radius: 0.5rem; background: rgb(255 255 255 / 3%); color: var(--muted); font: inherit; font-size: 0.8rem; font-weight: 600; }
      .sq-tab:hover { background: rgb(88 166 255 / 10%); color: var(--text); }
      .sq-tab[aria-selected="true"] { background: rgb(88 166 255 / 16%); border-color: var(--blue); color: var(--text); }
      .sq-tab small { display: block; margin-top: 0.15rem; font-size: 0.66rem; font-weight: 500; opacity: 0.72; font-variant-numeric: tabular-nums; }
      .sq-head { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: baseline; padding: 1.1rem 1.2rem; border-bottom: 1px solid var(--line); }
      .sq-why { color: var(--muted); font-size: 0.82rem; flex: 1 1 15rem; line-height: 1.5; }
      .stat { text-align: right; } .stat b { display: block; font-size: 1.1rem; font-variant-numeric: tabular-nums; } .stat span { color: var(--muted); font-size: 0.64rem; letter-spacing: 0.07em; text-transform: uppercase; }
      .pitch { padding: 1.4rem 1.2rem; background: linear-gradient(180deg, rgb(63 185 80 / 6%), transparent 60%); }
      .line { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 0.7rem; }
      .card { position: relative; width: 7.5rem; padding: 0.5rem 0.4rem; border: 1px solid var(--line); border-radius: 0.5rem; background: var(--panel-2); text-align: center; cursor: pointer; }
      .card:hover { border-color: var(--blue); }
      .card.cap { border-color: var(--blue); box-shadow: 0 0 0 1px rgb(88 166 255 / 30%); }
      .card.vc { border-color: rgb(88 166 255 / 45%); }
      .card-name { font-size: 0.78rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-meta { margin-top: 0.15rem; color: var(--muted); font-size: 0.65rem; }
      .card-proj { margin-top: 0.25rem; font-size: 0.85rem; font-weight: 700; color: var(--blue); }
      .badge { position: absolute; top: -0.45rem; right: -0.35rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; display: grid; place-items: center; font-size: 0.6rem; font-weight: 800; background: var(--blue); color: #06090d; }
      .badge.v { background: #2c4257; color: var(--text); }
      .card-tags { margin-top: 0.2rem; display: flex; gap: 0.2rem; justify-content: center; min-height: 0.9rem; }
      .bench-strip { margin-top: 1rem; padding-top: 0.9rem; border-top: 1px dashed var(--line); }
      .bench-label { text-align: center; color: var(--muted); font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.6rem; }
      .bench-strip .card { opacity: 0.6; }

      /* consensus */
      .cons-grid { display: grid; gap: 0.45rem; padding: 1.15rem; }
      .cons-row { display: grid; grid-template-columns: 6.5rem 1fr auto; gap: 0.8rem; align-items: center; font-size: 0.8rem; cursor: pointer; padding: 0.2rem 0.3rem; border-radius: 0.3rem; }
      .cons-row:hover { background: rgb(88 166 255 / 8%); }
      .pips { display: flex; gap: 0.15rem; }
      .pip { width: 0.8rem; height: 0.8rem; border-radius: 0.15rem; background: rgb(255 255 255 / 8%); }
      .pip.on { background: var(--green); }
      .cons-note { color: var(--muted); font-size: 0.75rem; }

      /* teams */
      .tm-grid { display: grid; gap: 0.6rem; padding: 1.15rem; grid-template-columns: repeat(auto-fill, minmax(17.5rem, 1fr)); }
      .tm-card { padding: 0.9rem 1rem; border: 1px solid var(--line); border-radius: 0.55rem; background: rgb(255 255 255 / 2%); }
      .tm-card.thin { border-style: dashed; opacity: 0.85; }
      .tm-top { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.15rem; }
      .tm-abbr { font-weight: 800; font-size: 0.95rem; letter-spacing: 0.04em; }
      .tm-full { color: var(--muted); font-size: 0.7rem; }
      .tm-proj { margin-left: auto; font-weight: 700; font-size: 1rem; color: var(--blue); font-variant-numeric: tabular-nums; }
      .tm-fx { display: flex; gap: 0.2rem; margin: 0.55rem 0 0.6rem; }
      .tm-fdr, .fdr-blk { flex: 1; height: 1.15rem; border-radius: 0.2rem; display: grid; place-items: center; font-size: 0.58rem; font-weight: 800; color: #06090d; }
      .tm-rows { display: grid; gap: 0.22rem; }
      .tm-row { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.72rem; }
      .tm-row em { color: var(--muted); font-style: normal; } .tm-row b { font-variant-numeric: tabular-nums; }
      .tm-sp { margin-top: 0.6rem; padding-top: 0.5rem; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 0.3rem; font-size: 0.68rem; }
      .tm-note { margin-top: 0.6rem; padding-top: 0.5rem; border-top: 1px dashed var(--line); color: var(--amber); font-size: 0.68rem; line-height: 1.45; }
      .tm-cs { display: inline-block; padding: 0.05rem 0.3rem; border-radius: 0.25rem; background: rgb(63 185 80 / 16%); color: #56d364; font-size: 0.6rem; font-weight: 800; }
      .fdr-1 { background: #56d364; } .fdr-2 { background: #3fb950; } .fdr-3 { background: #7d8590; } .fdr-4 { background: #d29922; } .fdr-5 { background: #f85149; }

      /* set pieces */
      .sp-grid { display: grid; gap: 0.5rem; padding: 1.15rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
      .sp-card { padding: 0.75rem 0.85rem; border: 1px solid var(--line); border-radius: 0.5rem; background: rgb(255 255 255 / 2%); }
      .sp-team { font-weight: 800; font-size: 0.82rem; letter-spacing: 0.04em; margin-bottom: 0.5rem; }
      .sp-line { display: flex; gap: 0.4rem; align-items: baseline; margin-bottom: 0.3rem; font-size: 0.75rem; }
      .sp-kind { width: 2.6rem; flex: none; color: var(--muted); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; }
      .sp-takers { display: flex; flex-wrap: wrap; gap: 0.3rem; }
      .sp-taker { cursor: pointer; }
      .sp-taker:hover .sp-nm { color: var(--blue); }
      .sp-nm { font-weight: 600; } .sp-rk { color: var(--muted); font-size: 0.66rem; }

      /* news */
      .nw-list { display: grid; gap: 0.5rem; padding: 1.15rem; }
      .nw-item { display: grid; grid-template-columns: 2.2rem 1fr; gap: 0.75rem; padding: 0.7rem 0.85rem; border: 1px solid var(--line); border-radius: 0.5rem; background: rgb(255 255 255 / 2%); }
      .nw-score { display: grid; place-items: center; align-self: start; width: 2.2rem; height: 1.7rem; border-radius: 0.3rem; font-size: 0.78rem; font-weight: 800; background: rgb(88 166 255 / 14%); color: var(--blue); font-variant-numeric: tabular-nums; }
      .nw-score.hot { background: rgb(248 81 73 / 18%); color: #ff7b72; }
      .nw-title { font-size: 0.86rem; font-weight: 600; line-height: 1.4; }
      .nw-title a { color: var(--text); text-decoration: none; }
      .nw-title a:hover { color: var(--blue); text-decoration: underline; }
      .nw-meta { margin-top: 0.3rem; color: var(--muted); font-size: 0.68rem; }
      .nw-tags { margin-top: 0.4rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
      .nw-player { cursor: pointer; padding: 0.1rem 0.35rem; border-radius: 0.25rem; background: rgb(88 166 255 / 12%); color: var(--blue); font-size: 0.68rem; font-weight: 600; }
      .nw-player:hover { background: rgb(88 166 255 / 22%); }
      .nw-club { padding: 0.1rem 0.3rem; border-radius: 0.25rem; background: rgb(255 255 255 / 6%); color: var(--muted); font-size: 0.64rem; }
      .nw-empty { padding: 1.15rem; color: var(--muted); font-size: 0.82rem; line-height: 1.6; }

      /* overview cards */
      .ov-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); margin-bottom: 1.5rem; }
      .ov-card { border: 1px solid var(--line); border-radius: 0.7rem; background: var(--panel); padding: 1.1rem 1.2rem; }
      .ov-card h3 { margin: 0 0 0.15rem; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
      .ov-card .v { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
      .ov-card .s { color: var(--muted); font-size: 0.75rem; margin-top: 0.15rem; }
      .miniclick { cursor: pointer; }
      .miniclick:hover { color: var(--blue); }

      /* tooltip + modal (unchanged behaviour) */
      #tip { position: fixed; z-index: 60; pointer-events: none; max-width: 21rem; padding: 0.7rem 0.8rem; border: 1px solid var(--line); border-radius: 0.55rem; background: #0d1218; box-shadow: 0 10px 30px rgb(0 0 0 / 55%); opacity: 0; transform: translateY(4px); transition: opacity 0.1s, transform 0.1s; }
      #tip[data-show="1"] { opacity: 1; transform: none; }
      .tip-head { display: flex; align-items: baseline; gap: 0.4rem; margin-bottom: 0.5rem; }
      .tip-name { font-weight: 700; font-size: 0.88rem; }
      .tip-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem 0.7rem; }
      .tip-cell span { display: block; color: var(--muted); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; }
      .tip-cell b { font-size: 0.86rem; font-variant-numeric: tabular-nums; }
      .tip-fx { margin-top: 0.55rem; color: var(--muted); font-size: 0.68rem; }
      .tip-news { margin-top: 0.5rem; padding-top: 0.45rem; border-top: 1px solid var(--line); color: var(--amber); font-size: 0.7rem; }
      .tip-hint { margin-top: 0.5rem; color: var(--muted); font-size: 0.62rem; opacity: 0.8; }

      #modal { position: fixed; inset: 0; z-index: 80; display: none; align-items: flex-start; justify-content: center; padding: 3rem 1rem; overflow-y: auto; background: rgb(2 4 8 / 78%); }
      #modal[data-open="1"] { display: flex; }
      .modal-box { width: min(60rem, 100%); border: 1px solid var(--line); border-radius: 0.8rem; background: var(--panel); box-shadow: 0 20px 60px rgb(0 0 0 / 60%); }
      .modal-head { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 1rem; align-items: baseline; padding: 1.2rem 1.3rem; border-bottom: 1px solid var(--line); background: var(--panel); border-radius: 0.8rem 0.8rem 0 0; }
      .modal-head h3 { margin: 0; font-size: 1.25rem; }
      .modal-sub { color: var(--muted); font-size: 0.78rem; }
      .modal-close { margin-left: auto; appearance: none; cursor: pointer; width: 2rem; height: 2rem; border-radius: 0.4rem; border: 1px solid var(--line); background: rgb(255 255 255 / 4%); color: var(--text); font: inherit; font-size: 1rem; }
      .modal-close:hover { background: rgb(248 81 73 / 16%); border-color: var(--red); }
      .modal-body { padding: 1.2rem 1.3rem 1.6rem; }
      .derived-box { margin-bottom: 1.3rem; padding: 0.9rem 1rem; border: 1px solid rgb(88 166 255 / 30%); border-radius: 0.55rem; background: rgb(88 166 255 / 7%); }
      .derived-box h4 { margin: 0 0 0.2rem; font-size: 0.8rem; color: var(--blue); }
      .derived-box p { margin: 0 0 0.7rem; color: var(--muted); font-size: 0.72rem; line-height: 1.5; }
      .stat-group { margin-bottom: 1.4rem; } .stat-group h4 { margin: 0 0 0.55rem; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
      .stat-grid { display: grid; gap: 0.4rem 0.9rem; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); }
      .stat-item { display: flex; justify-content: space-between; gap: 0.6rem; padding: 0.32rem 0.5rem; border-radius: 0.3rem; background: rgb(255 255 255 / 3%); font-size: 0.78rem; }
      .stat-item em { color: var(--muted); font-style: normal; font-size: 0.72rem; }
      .stat-item b { font-variant-numeric: tabular-nums; white-space: nowrap; }
      .stat-item.empty b { color: var(--muted); opacity: 0.5; }
      .loading { padding: 2rem; text-align: center; color: var(--muted); }

      @media (max-width: 48rem) {
        .topbar-inner {
          width: calc(100% - 1rem);
          display: grid;
          grid-template-columns: 1fr auto;
          gap: 0.35rem 0.75rem;
          padding: 0.55rem 0 0.45rem;
        }
        .brand { min-width: 0; }
        .stale { align-self: center; font-size: 0.62rem; white-space: nowrap; }
        nav.tabs {
          grid-column: 1 / -1;
          flex-wrap: nowrap;
          overflow-x: auto;
          overscroll-behavior-inline: contain;
          scrollbar-width: none;
          padding-bottom: 0.1rem;
        }
        nav.tabs::-webkit-scrollbar { display: none; }
        .navtab { flex: 0 0 auto; padding: 0.38rem 0.65rem; }
        .shell { width: calc(100% - 1rem); }
        .vh { padding-top: 1.25rem; }
        .filters { padding: 0.75rem; }
        .filters input { min-width: 100%; width: 100%; }
        .rescount { width: 100%; margin-left: 0; }
        .pitch { padding-inline: 0.5rem; }
        .card { width: 6.4rem; }
        #modal { padding: 0; }
        .modal-box { min-height: 100%; border-radius: 0; border-block: 0; }
        .modal-head { border-radius: 0; }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand"><b>FPL Analyzer</b><span>2026/27</span></div>
        <nav class="tabs" id="nav" role="tablist" aria-label="Views"></nav>
        <div class="stale" id="stale"></div>
      </div>
    </div>

    <div class="shell">
      <section class="view" id="view-overview"></section>
      <section class="view" id="view-players"></section>
      <section class="view" id="view-squads"></section>
      <section class="view" id="view-teams"></section>
      <section class="view" id="view-setpieces"></section>
      <section class="view" id="view-news"></section>
    </div>

    <div id="tip" role="tooltip" aria-hidden="true"></div>
